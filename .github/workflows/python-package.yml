name: ASKUTTY Safe Repo Check

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  workflow_dispatch:

jobs:
  safe-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies only if needed
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found. Skipping dependency install."
          fi

      - name: Python syntax check
        run: |
          files=$(find . \
            -path ./.git -prune -o \
            -path ./node_modules -prune -o \
            -path ./__pycache__ -prune -o \
            -name "*.py" -print)

          if [ -z "$files" ]; then
            echo "No Python files found. Skipping Python syntax check."
          else
            echo "$files"
            python -m py_compile $files
          fi

      - name: Shell syntax check
        run: |
          files=$(find . \
            -path ./.git -prune -o \
            -path ./node_modules -prune -o \
            -name "*.sh" -print)

          if [ -z "$files" ]; then
            echo "No shell scripts found. Skipping shell syntax check."
          else
            for file in $files; do
              echo "Checking $file"
              bash -n "$file"
            done
          fi

      - name: Run pytest only when tests exist
        run: |
          if find . \
            -path ./.git -prune -o \
            -path ./node_modules -prune -o \
            \( -path "*/tests/*.py" -o -name "test_*.py" -o -name "*_test.py" \) -print -quit | grep -q .; then
            pip install pytest
            pytest
          else
            echo "No tests found. Skipping pytest safely."
          fi
